<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b1026">
<title>a love letter</title>
<style>
  :root{
    --ink:#2b2440;
    --ink-soft:#6b6480;
    --paper:#fcf8ef;
    --paper-2:#f2e9d6;
    --gold:#c9a227;
    --gold-soft:#e6cd8f;
    --night:#0b1026;
    --shadow:0 18px 40px rgba(4,7,22,.45);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;width:100%;max-width:100%;overflow-x:hidden;background:var(--night);}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:#efe9dc;
    min-height:100vh;
    background:radial-gradient(120% 80% at 50% -10%, #232a5c 0%, #12173a 45%, #0b1026 100%);
    touch-action:manipulation;
  }
  #stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;}
  #fx{position:fixed;inset:0;width:100%;height:100%;z-index:30;pointer-events:none;}
  .screen{
    position:fixed;inset:0;z-index:10;
    overflow-y:auto;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;
    padding:calc(env(safe-area-inset-top,0px) + 20px) calc(env(safe-area-inset-right,0px) + 18px) calc(env(safe-area-inset-bottom,0px) + 24px) calc(env(safe-area-inset-left,0px) + 18px);
    opacity:0;visibility:hidden;pointer-events:none;
    transition:opacity .32s ease, visibility .32s ease;
  }
  .screen.active{opacity:1;visibility:visible;pointer-events:auto;z-index:20;}
  .wrap{width:100%;max-width:460px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;justify-content:center;}

  /* 开场 */
  .intro{text-align:center;}
  .seal{width:66px;height:66px;margin:0 auto 20px;border-radius:50%;border:1px solid rgba(230,205,143,.35);
    display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,rgba(230,205,143,.12),transparent 70%);}
  .title{font-size:clamp(25px,7.2vw,32px);font-weight:600;letter-spacing:.1em;margin:0 0 22px;color:#f6efdd;}
  .intro-line{font-size:15px;line-height:2;color:rgba(239,233,220,.72);margin:0;letter-spacing:.03em;}
  .intro-lines{margin:0 0 30px;}
  .btn{
    display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;
    padding:0 24px;border:0;border-radius:999px;font-family:inherit;font-size:16px;font-weight:600;
    letter-spacing:.08em;cursor:pointer;transition:transform .15s ease,box-shadow .2s ease,opacity .2s ease;
  }
  .btn:active{transform:translateY(1px) scale(.99);}
  .btn.primary{background:linear-gradient(135deg,#ecd79e,#c9a227);color:#241d33;box-shadow:0 10px 26px rgba(201,162,39,.28);}
  .btn.ghost{background:transparent;color:#efe9dc;border:1px solid rgba(239,233,220,.32);}
  .paper .btn.ghost{color:var(--ink);border-color:rgba(43,36,64,.22);}
  .btn[hidden]{display:none;}
  .intro .btn.ghost{margin-top:12px;min-height:46px;font-size:15px;font-weight:500;}
  .foot-tip{font-size:12px;letter-spacing:.1em;color:rgba(239,233,220,.36);margin:18px 0 0;}

  /* 顶栏与进度 */
  .bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 16px;}
  .chip{min-height:36px;padding:0 15px;border-radius:999px;border:1px solid rgba(239,233,220,.24);
    background:rgba(255,255,255,.06);color:#e9e2d2;font-size:13px;font-family:inherit;cursor:pointer;letter-spacing:.06em;}
  .chip:active{background:rgba(255,255,255,.14);}
  .keys{display:flex;gap:7px;align-items:center;}
  .key-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.16);transition:all .3s ease;}
  .key-dot.on{background:var(--gold-soft);box-shadow:0 0 9px rgba(230,205,143,.85);}
  .chapter-label{font-size:12.5px;letter-spacing:.3em;color:rgba(239,233,220,.52);margin:0 0 12px 4px;}

  /* 信纸 */
  .paper{
    position:relative;background:linear-gradient(180deg,var(--paper),var(--paper-2));color:var(--ink);
    border-radius:20px;padding:22px 20px 20px;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.55);
  }
  .paper-title{font-size:19px;font-weight:600;letter-spacing:.06em;margin:0 0 14px;color:var(--ink);}
  .chapter-intro{font-size:14.5px;line-height:1.9;color:var(--ink-soft);margin:0 0 18px;letter-spacing:.02em;}
  .letter-body{white-space:pre-wrap;font-size:15.5px;line-height:2;color:var(--ink);margin:0 0 22px;letter-spacing:.02em;}
  .stamp{width:44px;height:44px;margin:0 auto 14px;border-radius:50%;border:1px solid rgba(201,162,39,.42);
    display:flex;align-items:center;justify-content:center;color:#b18b2b;font-size:17px;}
  /* 彩蛋爱心层：位于信纸底色之上、文字之下（只比信纸背景靠前一层） */
  #eggFx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;}
  #screen-egg .paper>*:not(#eggFx){position:relative;z-index:1;}

  /* 密码锁 */
  .prompt{font-size:14.5px;line-height:1.8;color:var(--ink);margin:0;letter-spacing:.02em;}
  .dots{display:flex;gap:16px;justify-content:center;margin:22px 0 4px;}
  .dots i{width:14px;height:14px;border-radius:50%;border:1px solid rgba(43,36,64,.32);transition:all .18s ease;}
  .dots i.on{background:var(--gold);border-color:var(--gold);box-shadow:0 0 10px rgba(201,162,39,.55);}
  .dots.ok i{background:#7f9c5e;border-color:#7f9c5e;box-shadow:none;}
  .dots.shake{animation:shake .42s ease;}
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-7px);}
    40%{transform:translateX(6px);}
    60%{transform:translateX(-4px);}
    80%{transform:translateX(3px);}
  }
  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px;}
  .key{min-height:54px;border-radius:14px;border:1px solid rgba(43,36,64,.14);background:rgba(255,255,255,.6);
    color:var(--ink);font-size:22px;font-weight:600;font-family:inherit;cursor:pointer;transition:background .15s ease,transform .1s ease;}
  .key:active{background:rgba(43,36,64,.1);transform:scale(.98);}
  .key.small{font-size:14.5px;font-weight:500;letter-spacing:.06em;color:var(--ink-soft);}
  .lock-note{font-size:12.5px;color:rgba(43,36,64,.45);text-align:center;margin:14px 0 0;letter-spacing:.04em;}

  /* 问答 */
  .quiz-count{font-size:12px;letter-spacing:.22em;color:rgba(43,36,64,.4);margin:0 0 10px;}
  .options{display:flex;flex-direction:column;gap:10px;margin-top:18px;}
  .option{min-height:52px;padding:13px 16px;border-radius:14px;border:1px solid rgba(43,36,64,.14);
    background:rgba(255,255,255,.62);color:var(--ink);font-size:15px;line-height:1.5;text-align:left;
    font-family:inherit;cursor:pointer;transition:background .15s ease,border-color .2s ease;}
  .option:active{background:rgba(43,36,64,.07);}
  .option.wrong{border-color:#d9a3a2;background:#f8e7e5;color:#9a5c5b;}
  .option.right{border-color:#a3b784;background:#eff3e6;color:#5f7a45;}

  /* 九宫格 */
  .jigsaw{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;width:100%;max-width:330px;aspect-ratio:1/1;
    margin:0 auto;border-radius:12px;overflow:hidden;background:rgba(43,36,64,.12);
    touch-action:none;user-select:none;-webkit-user-select:none;}
  .tile{background-repeat:no-repeat;background-color:#141a3a;transition:transform .12s ease,box-shadow .12s ease;}
  .tile.pressed{transform:scale(.955);}
  .tile.hover{box-shadow:inset 0 0 0 3px rgba(201,162,39,.9);}
  .tile.selected{box-shadow:inset 0 0 0 3px rgba(201,162,39,.72);transform:scale(.97);}
  .jigsaw.done .tile{box-shadow:none;transform:none;}

  /* 提示与消息 */
  .hint-row{display:flex;flex-wrap:wrap;align-items:flex-start;gap:10px;
    margin-top:18px;padding-top:15px;border-top:1px dashed rgba(43,36,64,.16);}
  .link-btn{background:none;border:0;padding:2px 0;color:#8a6f2e;font-size:13.5px;font-family:inherit;
    text-decoration:underline;text-underline-offset:3px;cursor:pointer;letter-spacing:.02em;}
  .hint-text{flex:1 1 100%;font-size:13.5px;line-height:1.75;color:var(--ink-soft);margin:2px 0 0;}
  .msg{min-height:19px;font-size:13.5px;line-height:1.6;color:#9a5c5b;text-align:center;margin:12px 0 0;}

  /* 终章 */
  .stars-line{text-align:center;letter-spacing:.9em;color:rgba(230,205,143,.62);font-size:13px;margin:0 0 14px;padding-left:.9em;}
  .final-title{text-align:center;font-size:20px;font-weight:600;letter-spacing:.22em;color:#f2ead8;margin:0 0 18px;padding-left:.22em;}
  .final-letter{min-height:220px;max-height:52vh;overflow-y:auto;white-space:pre-wrap;
    font-size:15.5px;line-height:2.05;letter-spacing:.02em;}
  .final-actions{margin:20px 0 0;}
  .final-actions .btn.ghost{margin-top:10px;min-height:46px;font-size:15px;font-weight:500;}
  .egg-star{display:block;margin:24px auto 0;width:58px;height:58px;border-radius:50%;
    border:1px solid rgba(230,205,143,.28);background:radial-gradient(circle,rgba(230,205,143,.14),transparent 70%);
    color:rgba(230,205,143,.42);font-size:21px;line-height:1;font-family:inherit;cursor:pointer;
    transition:color .35s ease,box-shadow .35s ease,transform .2s ease;
    -webkit-touch-callout:none;user-select:none;-webkit-user-select:none;}
  .egg-star.ready{color:#f3e2b3;box-shadow:0 0 26px rgba(230,205,143,.32);}
  .egg-star.ready:active{transform:scale(.94);}
  .egg-tip{text-align:center;font-size:12px;letter-spacing:.08em;color:rgba(239,233,220,.34);margin:12px 0 0;transition:opacity .35s ease;}

  /* 信匣 */
  .archive-list{max-height:56vh;overflow-y:auto;margin:0 0 18px;}
  .archive-item{padding:12px 0;border-bottom:1px dashed rgba(43,36,64,.14);}
  .archive-item:last-child{border-bottom:0;}
  .archive-name{font-size:13.5px;font-weight:600;letter-spacing:.06em;color:#8a6f2e;margin:0 0 6px;}
  .archive-text{white-space:pre-wrap;font-size:14px;line-height:1.9;color:var(--ink-soft);margin:0;}
  .archive-empty{font-size:14px;line-height:1.9;color:var(--ink-soft);margin:0 0 18px;}

  .noscript{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:#0b1026;color:#efe9dc;font-size:16px;padding:24px;text-align:center;z-index:9999;}
</style>
</head>
<body>

<canvas id="stars" aria-hidden="true"></canvas>
<canvas id="fx" aria-hidden="true"></canvas>

<noscript><div class="noscript">请开启 JavaScript 后再打开这封信。</div></noscript>

<!-- 开场 -->
<section id="screen-intro" class="screen active" aria-hidden="true">
  <div class="wrap intro">
    <div class="seal" aria-hidden="true">
      <svg viewBox="0 0 48 48" width="42" height="42" role="img" aria-label="信封">
        <rect x="6" y="14" width="36" height="24" rx="3" fill="none" stroke="#e6cd8f" stroke-width="1.6"></rect>
        <path d="M6 16 L24 28 L42 16" fill="none" stroke="#e6cd8f" stroke-width="1.6" stroke-linecap="round"></path>
      </svg>
    </div>
    <h1 class="title" id="introTitle">a love letter</h1>
    <div class="intro-lines subtitle">
      <p class="intro-line" id="introL1"></p>
      <p class="intro-line" id="introL2"></p>
      <p class="intro-line" id="introL3"></p>
    </div>
    <button class="btn primary" type="button" id="startBtn" data-action="start">开始拆信</button>
    <button class="btn ghost" type="button" id="restartBtn" data-action="restart" hidden>从头开始</button>
    <p class="foot-tip" id="introTip"></p>
  </div>
</section>

<!-- 关卡 -->
<section id="screen-stage" class="screen" aria-hidden="true">
  <div class="wrap">
    <header class="bar">
      <button class="chip" type="button" data-action="archive">信匣</button>
      <div class="keys" id="keys" aria-label="已经收下的信"></div>
      <button class="chip" type="button" id="muteBtn" data-action="mute">声音开</button>
    </header>
    <div class="chapter-label" id="chapterLabel"></div>
    <div class="paper">
      <p class="chapter-intro" id="chapterIntro"></p>
      <div id="puzzleHost"></div>
      <div class="hint-row">
        <button class="link-btn" type="button" data-action="hint">给我一点提示</button>
        <p class="hint-text" id="hintText"></p>
      </div>
      <p class="msg" id="msg" role="status"></p>
    </div>
  </div>
</section>

<!-- 拆信结果 -->
<section id="screen-unlock" class="screen" aria-hidden="true">
  <div class="wrap">
    <div class="paper">
      <div class="stamp" aria-hidden="true">✶</div>
      <h2 class="paper-title" id="unlockTitle"></h2>
      <p class="letter-body" id="unlockLetter"></p>
      <button class="btn primary" type="button" data-action="next">收下这封信</button>
    </div>
  </div>
</section>

<!-- 信匣 -->
<section id="screen-archive" class="screen" aria-hidden="true">
  <div class="wrap">
    <div class="paper">
      <h2 class="paper-title">已经收下的信</h2>
      <div class="archive-list" id="archiveList"></div>
      <button class="btn ghost" type="button" data-action="close-archive">合上信匣</button>
    </div>
  </div>
</section>

<!-- 终章 -->
<section id="screen-final" class="screen" aria-hidden="true">
  <div class="wrap">
    <p class="stars-line" aria-hidden="true">✶ ✶ ✶ ✶ ✶ ✶</p>
    <h2 class="final-title">终章 · 落款</h2>
    <div class="paper final-letter" id="finalLetter" aria-live="polite"></div>
    <div class="final-actions">
      <button class="btn primary" type="button" id="typeBtn" data-action="type">直接读完</button>
      <button class="btn ghost" type="button" data-action="restart">重新拆信</button>
    </div>
    <button class="egg-star" type="button" id="eggStar" aria-label="按住这颗星">✦</button>
    <p class="egg-tip" id="eggTip">按住这颗星，久一点</p>
  </div>
</section>

<!-- 彩蛋 -->
<section id="screen-egg" class="screen" aria-hidden="true">
  <div class="wrap">
    <div class="paper">
      <div class="stamp" aria-hidden="true">✦</div>
      <p class="letter-body" id="eggText"></p>
      <button class="btn primary" type="button" data-action="close-egg">收好这句话</button>
    </div>
  </div>
</section>

<!-- 兜底 -->
<section id="screen-error" class="screen" aria-hidden="true">
  <div class="wrap">
    <div class="paper">
      <h2 class="paper-title">哎呀，出错了</h2>
      <p class="letter-body">请再打开这封信一次。如果还是不行，告诉我你卡在哪一步。</p>
    </div>
  </div>
</section>

<script>

  'use strict';

  /* ============================================================
     CONFIG —— 所有可替换的内容都在这里
     1) her / me：昵称与署名
     2) chapters[0].pin / chapters[3].pin：两关的 4 位密码（互为倒序）
     3) chapters[1].questions / chapters[4].questions：问答题目、选项、正确答案下标
     4) jigsawImage：拼图用的照片（填 Base64 data URL），留空则使用自绘占位图
     5) finalLetter / egg：终章情书与隐藏彩蛋

  var CN = ['', '一', '二', '三', '四', '五', '六'];
  var STORE_KEY = 'onlyforher_v1_state';
  var state = { chapter: 1, solved: [], jigsaw: null, jigsawChapter: 0, muted: false };

  function $(sel, root) { return (root || document).querySelector(sel); }
  function $$(sel, root) {
    var list = (root || document).querySelectorAll(sel);
    return Array.prototype.slice.call(list);
  }
  function fill(text) {
    return String(text)
      .replace(/\{her\}/g, CONFIG.her)
      .replace(/\{me\}/g, CONFIG.me)
      .replace(/\{n\}/g, String(Math.min(state.chapter, 6)));
  }
  function pick(list) { return list[Math.floor(Math.random() * list.length)]; }
  function clamp(n, min, max) { return Math.max(min, Math.min(max, n)); }

  var msgEl, chapterLabel, chapterIntro, hintText, unlockTitle, unlockLetter, archiveList,
      finalLetter, typeBtn, eggStar, eggTip, eggText, puzzleHost, keysEl, muteBtn;
  var hintLevel = 0;
  var typingTimer = null;
  var typed = false;
  var fullLetterText = '';
  var actx = null;
  var jig = null;

  /* ============================ 存档 ============================ */
  function saveState() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (err) { /* 本地存档不可用时静默跳过 */ }
  }
  function loadState() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return;
      var data = JSON.parse(raw);
      if (!data || typeof data !== 'object') return;
      if (typeof data.chapter === 'number') state.chapter = clamp(Math.round(data.chapter), 1, 6);
      if (Object.prototype.toString.call(data.solved) === '[object Array]') {
        state.solved = data.solved.filter(function (v) { return typeof v === 'number' && v >= 1 && v <= 6; });
      }
      if (Object.prototype.toString.call(data.jigsaw) === '[object Array]' && data.jigsaw.length === 9) {
        state.jigsaw = data.jigsaw.slice();
        state.jigsawChapter = data.jigsawChapter || 0;
      }
      state.muted = !!data.muted;
    } catch (err) { /* 存档损坏时按新进度开始 */ }
  }
  function hasProgress() { return state.solved.length > 0; }

  /* ============================ 声音 ============================ */
  function tone(freq, dur, type) {
    if (state.muted) return;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!actx) actx = new AC();
      if (actx.state === 'suspended') actx.resume();
      var osc = actx.createOscillator();
      var gain = actx.createGain();
      osc.type = type || 'sine';
      osc.frequency.value = freq || 600;
      gain.gain.value = 0.04;
      gain.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + (dur || 0.08));
      osc.connect(gain);
      gain.connect(actx.destination);
      osc.start();
      osc.stop(actx.currentTime + (dur || 0.08));
    } catch (err) { /* 部分环境不支持合成音，静默跳过 */ }
  }
  function successTones() { tone(660, 0.1); window.setTimeout(function () { tone(880, 0.16); }, 110); }

  function updateMute() {
    if (!muteBtn) return;
    muteBtn.textContent = state.muted ? '已静音' : '声音开';
    muteBtn.setAttribute('aria-pressed', state.muted ? 'true' : 'false');
  }
  function toggleMute() {
    state.muted = !state.muted;
    saveState();
    updateMute();
    if (!state.muted) tone(560, 0.06);
  }

  /* ============================ 屏幕切换 ============================ */
  function showScreen(id) {
    var nodes = $$('.screen');
    for (var i = 0; i < nodes.length; i++) {
      var on = nodes[i].id === id;
      nodes[i].classList.toggle('active', on);
      nodes[i].setAttribute('aria-hidden', on ? 'false' : 'true');
    }
    if (fxApi) fxApi.enter(id);
  }

  function renderKeys() {
    if (!keysEl) return;
    keysEl.innerHTML = '';
    for (var i = 1; i <= 6; i++) {
      var dot = document.createElement('span');
      dot.className = 'key-dot' + (state.solved.indexOf(i) >= 0 ? ' on' : '');
      keysEl.appendChild(dot);
    }
  }

  /* ============================ 关卡流程 ============================ */
  function mountChapter(n) {
    n = clamp(Math.round(n), 1, 5);
    state.chapter = n;
    saveState();

    var ch = CONFIG.chapters[n - 1];
    chapterLabel.textContent = '第 ' + CN[n] + ' 封 · ' + ch.name;
    chapterIntro.textContent = fill(ch.intro);
    msgEl.textContent = '';
    hintLevel = 0;
    hintText.textContent = '';
    jig = null;
    puzzleHost.innerHTML = '';

    if (ch.kind === 'lock') mountLock(ch);
    else if (ch.kind === 'quiz') mountQuiz(ch);
    else mountJigsaw(ch);

    renderKeys();
    showScreen('screen-stage');
    tone(520, 0.05);
  }

  function solveCurrent() {
    var id = state.chapter;
    if (state.solved.indexOf(id) < 0) state.solved.push(id);
    saveState();
    renderKeys();
    successTones();

    var ch = CONFIG.chapters[id - 1];
    unlockTitle.textContent = '第 ' + CN[id] + ' 封 · ' + ch.name;
    unlockLetter.textContent = fill(ch.letter);
    showScreen('screen-unlock');
  }

  function goNext() {
    var next = state.chapter + 1;
    if (next >= 6) {
      state.chapter = 6;
      if (state.solved.indexOf(6) < 0) state.solved.push(6);
      saveState();
      renderKeys();
      openFinal();
      return;
    }
    mountChapter(next);
  }

  function openFinal() {
    state.chapter = 6;
    if (state.solved.indexOf(6) < 0) state.solved.push(6);
    saveState();
    renderKeys();
    showScreen('screen-final');
    startTyping();
  }

  function showHint() {
    var ch = CONFIG.chapters[state.chapter - 1];
    if (!ch) return;
    var hints = ch.hints || [];
    if (hintLevel < hints.length) {
      hintText.textContent = hints[hintLevel];
      hintLevel++;
    } else {
      hintText.textContent = CONFIG.copy.hintEmpty;
    }
    tone(480, 0.05);
  }

  /* ============================ 密码锁 ============================ */
  function mountLock(ch) {
    var root = document.createElement('div');
    root.className = 'puzzle lock';

    var prompt = document.createElement('p');
    prompt.className = 'prompt';
    prompt.textContent = fill(ch.prompt);

    var dots = document.createElement('div');
    dots.className = 'dots';
    for (var d = 0; d < 4; d++) dots.appendChild(document.createElement('i'));

    var pad = document.createElement('div');
    pad.className = 'keypad';
    var layout = [
      { key: '1', label: '1' }, { key: '2', label: '2' }, { key: '3', label: '3' },
      { key: '4', label: '4' }, { key: '5', label: '5' }, { key: '6', label: '6' },
      { key: '7', label: '7' }, { key: '8', label: '8' }, { key: '9', label: '9' },
      { key: 'clear', label: '清空', small: true }, { key: '0', label: '0' }, { key: 'del', label: '⌫', small: true }
    ];
    layout.forEach(function (item) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'key' + (item.small ? ' small' : '');
      btn.setAttribute('data-key', item.key);
      btn.textContent = item.label;
      pad.appendChild(btn);
    });

    var note = document.createElement('p');
    note.className = 'lock-note';
    note.textContent = '四位数字，输满自动验证。';

    root.appendChild(prompt);
    root.appendChild(dots);
    root.appendChild(pad);
    root.appendChild(note);
    puzzleHost.appendChild(root);

    var value = '';
    var busy = false;

    function renderDots() {
      var nodes = dots.children;
      for (var i = 0; i < 4; i++) {
        nodes[i].className = i < value.length ? 'on' : '';
      }
    }

    function verify() {
      if (value === String(ch.pin)) {
        busy = true;
        dots.classList.add('ok');
        tone(660, 0.1);
        window.setTimeout(function () { successTones(); solveCurrent(); }, 260);
        return;
      }
      dots.classList.add('shake');
      msgEl.textContent = pick(CONFIG.copy.lockWrong);
      tone(220, 0.16, 'triangle');
      window.setTimeout(function () {
        dots.classList.remove('shake');
        value = '';
        busy = false;
        renderDots();
      }, 460);
    }

    pad.addEventListener('click', function (e) {
      var btn = e.target.closest('[data-key]');
      if (!btn || busy) return;
      var key = btn.getAttribute('data-key');

      if (key === 'clear') {
        value = '';
        renderDots();
        tone(360, 0.05);
        return;
      }
      if (key === 'del') {
        value = value.slice(0, -1);
        renderDots();
        tone(360, 0.05);
        return;
      }
      if (value.length >= 4) return;

      value += key;
      renderDots();
      tone(620, 0.05);
      msgEl.textContent = '';

      if (value.length === 4) {
        busy = true;
        window.setTimeout(verify, 220);
      }
    });
  }

  /* ============================ 记忆问答 ============================ */
  function mountQuiz(ch) {
    var root = document.createElement('div');
    root.className = 'puzzle quiz';

    var counter = document.createElement('p');
    counter.className = 'quiz-count';

    var question = document.createElement('p');
    question.className = 'prompt';

    var options = document.createElement('div');
    options.className = 'options';

    root.appendChild(counter);
    root.appendChild(question);
    root.appendChild(options);
    puzzleHost.appendChild(root);

    var index = 0;

    function render() {
      var q = ch.questions[index];
      counter.textContent = '第 ' + (index + 1) + ' / ' + ch.questions.length + ' 问';
      question.textContent = fill(q.q);
      options.innerHTML = '';
      q.options.forEach(function (text, i) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'option';
        btn.setAttribute('data-opt', String(i));
        btn.textContent = fill(text);
        options.appendChild(btn);
      });
    }

    options.addEventListener('click', function (e) {
      var btn = e.target.closest('.option');
      if (!btn || btn.disabled) return;
      var q = ch.questions[index];
      var choice = Number(btn.getAttribute('data-opt'));

      if (choice === q.answer) {
        btn.classList.add('right');
        btn.disabled = true;
        tone(700, 0.09);
        msgEl.textContent = '';
        window.setTimeout(function () {
          index++;
          if (index >= ch.questions.length) {
            successTones();
            solveCurrent();
          } else {
            render();
          }
        }, 420);
      } else {
        btn.classList.add('wrong');
        btn.disabled = true;
        msgEl.textContent = pick(CONFIG.copy.quizWrong);
        tone(240, 0.12, 'triangle');
      }
    });

    render();
  }

  /* ============================ 九宫格拼图 ============================ */
  var PLACEHOLDER_ART = '';

  function placeholderArt() {
    if (PLACEHOLDER_ART) return PLACEHOLDER_ART;
    try {
      var canvas = document.createElement('canvas');
      canvas.width = 900;
      canvas.height = 900;
      var g = canvas.getContext('2d');

      var sky = g.createLinearGradient(0, 0, 120, 900);
      sky.addColorStop(0, '#0d1738');
      sky.addColorStop(0.55, '#2b2352');
      sky.addColorStop(1, '#4b2c46');
      g.fillStyle = sky;
      g.fillRect(0, 0, 900, 900);

      var halo = g.createRadialGradient(640, 250, 20, 640, 250, 190);
      halo.addColorStop(0, 'rgba(247,230,180,.6)');
      halo.addColorStop(1, 'rgba(247,230,180,0)');
      g.fillStyle = halo;
      g.beginPath();
      g.arc(640, 250, 190, 0, Math.PI * 2);
      g.fill();

      g.fillStyle = '#f3e2b3';
      g.beginPath();
      g.arc(640, 250, 64, 0, Math.PI * 2);
      g.fill();

      for (var i = 0; i < 70; i++) {
        var sx = Math.random() * 900;
        var sy = Math.random() * 640;
        var sr = Math.random() * 1.7 + 0.6;
        g.globalAlpha = Math.random() * 0.6 + 0.2;
        g.fillStyle = '#ffffff';
        g.beginPath();
        g.arc(sx, sy, sr, 0, Math.PI * 2);
        g.fill();
      }
      g.globalAlpha = 1;

      g.fillStyle = '#0a1129';
      g.beginPath();
      g.moveTo(0, 700);
      g.quadraticCurveTo(210, 620, 430, 690);
      g.quadraticCurveTo(660, 760, 900, 650);
      g.lineTo(900, 900);
      g.lineTo(0, 900);
      g.closePath();
      g.fill();

      g.fillStyle = '#070c1f';
      g.beginPath();
      g.moveTo(0, 790);
      g.quadraticCurveTo(260, 720, 520, 780);
      g.quadraticCurveTo(740, 830, 900, 735);
      g.lineTo(900, 900);
      g.lineTo(0, 900);
      g.closePath();
      g.fill();

      g.fillStyle = '#04070f';
      g.beginPath();
      g.arc(402, 640, 26, 0, Math.PI * 2);
      g.fill();
      g.beginPath();
      g.moveTo(370, 708);
      g.quadraticCurveTo(364, 660, 402, 658);
      g.quadraticCurveTo(438, 660, 434, 708);
      g.closePath();
      g.fill();
      g.beginPath();
      g.arc(456, 648, 23, 0, Math.PI * 2);
      g.fill();
      g.beginPath();
      g.moveTo(428, 708);
      g.quadraticCurveTo(424, 664, 456, 662);
      g.quadraticCurveTo(486, 664, 484, 708);
      g.closePath();
      g.fill();

      g.textAlign = 'center';
      g.fillStyle = 'rgba(233,215,168,.92)';
      g.font = '600 30px "PingFang SC","Microsoft YaHei",sans-serif';
      g.fillText('这里会放我们的照片', 450, 140);
      g.fillStyle = 'rgba(233,215,168,.5)';
      g.font = '400 20px "PingFang SC","Microsoft YaHei",sans-serif';
      g.fillText('assets_src/jigsaw.jpg', 450, 182);

      PLACEHOLDER_ART = canvas.toDataURL('image/jpeg', 0.88);
    } catch (err) {
      PLACEHOLDER_ART = '';
    }
    return PLACEHOLDER_ART;
  }

  function makeShuffled(n) {
    var arr = [];
    var i;
    for (i = 0; i < n; i++) arr.push(i);
    var tries = 0;
    do {
      for (i = n - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = arr[i];
        arr[i] = arr[j];
        arr[j] = t;
      }
      tries++;
    } while ((isSolvedOrder(arr) || misplacedCount(arr) < 6) && tries < 60);
    return arr;
  }
  function isSolvedOrder(arr) {
    for (var i = 0; i < arr.length; i++) {
      if (arr[i] !== i) return false;
    }
    return true;
  }
  function misplacedCount(arr) {
    var count = 0;
    for (var i = 0; i < arr.length; i++) {
      if (arr[i] !== i) count++;
    }
    return count;
  }

  function mountJigsaw(ch) {
    var root = document.createElement('div');
    root.className = 'puzzle jigsaw-wrap';

    var grid = document.createElement('div');
    grid.className = 'jigsaw';

    var note = document.createElement('p');
    note.className = 'lock-note';
    note.textContent = '拖动一块到另一块上，或点两块交换。';

    root.appendChild(grid);
    root.appendChild(note);
    puzzleHost.appendChild(root);

    var img = CONFIG.jigsawImage || placeholderArt();
    var order;
    if (state.jigsaw && state.jigsaw.length === 9 && state.jigsawChapter === ch.id) {
      order = state.jigsaw.slice();
    } else {
      order = makeShuffled(9);
      state.jigsaw = order.slice();
      state.jigsawChapter = ch.id;
      saveState();
    }

    jig = {
      grid: grid,
      order: order,
      img: img,
      selected: -1,
      press: -1
    };

    paintJigsaw();
    grid.addEventListener('pointerdown', onJigDown);
    grid.addEventListener('pointermove', onJigMove);
  }

  function paintJigsaw() {
    if (!jig) return;
    var grid = jig.grid;
    var order = jig.order;
    grid.innerHTML = '';
    for (var slot = 0; slot < 9; slot++) {
      var piece = order[slot];
      var row = Math.floor(piece / 3);
      var col = piece % 3;
      var tile = document.createElement('div');
      tile.className = 'tile';
      tile.setAttribute('data-slot', String(slot));
      if (jig.selected === slot) tile.classList.add('selected');
      if (jig.img) {
        tile.style.backgroundImage = 'url("' + jig.img + '")';
        tile.style.backgroundSize = '300% 300%';
        tile.style.backgroundPosition = (col * 50) + '% ' + (row * 50) + '%';
      }
      grid.appendChild(tile);
    }
  }

  function swapJigsaw(a, b) {
    if (!jig) return;
    var t = jig.order[a];
    jig.order[a] = jig.order[b];
    jig.order[b] = t;
    jig.selected = -1;
    state.jigsaw = jig.order.slice();
    saveState();
    paintJigsaw();
    tone(600, 0.05);
    if (isSolvedOrder(jig.order)) {
      jig.grid.classList.add('done');
      successTones();
      window.setTimeout(solveCurrent, 640);
    }
  }

  function onJigDown(e) {
    if (!jig) return;
    var tile = e.target.closest('.tile');
    if (!tile) return;
    jig.press = Number(tile.getAttribute('data-slot'));
    tile.classList.add('pressed');
    if (e.cancelable) e.preventDefault();
  }

  function onJigMove(e) {
    if (!jig || jig.press < 0) return;
    var el = document.elementFromPoint(e.clientX, e.clientY);
    var tile = el && el.closest ? el.closest('.tile') : null;
    var target = tile ? Number(tile.getAttribute('data-slot')) : -1;
    var tiles = jig.grid.children;
    for (var i = 0; i < tiles.length; i++) {
      var slot = Number(tiles[i].getAttribute('data-slot'));
      tiles[i].classList.toggle('hover', target >= 0 && slot === target && target !== jig.press);
    }
  }

  function onPointerUpGlobal(e) {
    if (!jig || jig.press < 0) return;
    var from = jig.press;
    jig.press = -1;

    var tiles = jig.grid.children;
    for (var i = 0; i < tiles.length; i++) tiles[i].classList.remove('pressed', 'hover');

    var el = document.elementFromPoint(e.clientX, e.clientY);
    var tile = el && el.closest ? el.closest('.tile') : null;
    var to = tile ? Number(tile.getAttribute('data-slot')) : -1;

    if (to < 0) {
      jig.selected = -1;
      paintJigsaw();
      return;
    }
    if (to !== from) {
      swapJigsaw(from, to);
      return;
    }
    if (jig.selected < 0) {
      jig.selected = from;
      paintJigsaw();
    } else if (jig.selected === from) {
      jig.selected = -1;
      paintJigsaw();
    } else {
      swapJigsaw(jig.selected, from);
    }
  }

  /* ============================ 信匣 ============================ */
  function openArchive() {
    archiveList.innerHTML = '';
    var count = 0;

    for (var id = 1; id <= 5; id++) {
      if (state.solved.indexOf(id) < 0) continue;
      var ch = CONFIG.chapters[id - 1];
      archiveList.appendChild(buildArchiveItem('第 ' + CN[id] + ' 封 · ' + ch.name, fill(ch.letter)));
      count++;
    }
    if (state.solved.indexOf(6) >= 0) {
      archiveList.appendChild(buildArchiveItem('终章 · 落款', fill(CONFIG.finalLetter)));
      count++;
    }
    if (count === 0) {
      var empty = document.createElement('p');
      empty.className = 'archive-empty';
      empty.textContent = '还没有收下的信。把眼前的谜题解开，它们就会一封一封躺进来。';
      archiveList.appendChild(empty);
    }
    showScreen('screen-archive');
  }

  function buildArchiveItem(name, text) {
    var item = document.createElement('div');
    item.className = 'archive-item';
    var title = document.createElement('p');
    title.className = 'archive-name';
    title.textContent = name;
    var body = document.createElement('p');
    body.className = 'archive-text';
    body.textContent = text;
    item.appendChild(title);
    item.appendChild(body);
    return item;
  }

  /* ============================ 终章与彩蛋 ============================ */
  function startTyping() {
    fullLetterText = fill(CONFIG.finalLetter);
    finalLetter.textContent = '';
    finalLetter.scrollTop = 0;
    typed = false;
    if (typingTimer) { window.clearInterval(typingTimer); typingTimer = null; }
    typeBtn.textContent = '直接读完';
    eggStar.classList.remove('ready');
    eggTip.style.opacity = '.34';

    var index = 0;
    typingTimer = window.setInterval(function () {
      index += 2;
      if (index >= fullLetterText.length) {
        finalLetter.textContent = fullLetterText;
        finishTyping();
        return;
      }
      finalLetter.textContent = fullLetterText.slice(0, index);
      finalLetter.scrollTop = finalLetter.scrollHeight;
    }, 26);
  }

  function finishTyping() {
    if (typingTimer) { window.clearInterval(typingTimer); typingTimer = null; }
    finalLetter.textContent = fullLetterText;
    typed = true;
    typeBtn.textContent = '再读一遍';
    eggStar.classList.add('ready');
    eggTip.style.opacity = '1';
    if (fxApi) fxApi.bloom();
  }

  function openEgg() {
    eggText.textContent = fill(CONFIG.egg);
    showScreen('screen-egg');
    tone(760, 0.12);
    window.setTimeout(function () { tone(980, 0.18); }, 130);
  }

  var eggTimer = null;

  function bindEgg() {
    eggStar.addEventListener('pointerdown', function (e) {
      if (!typed) return;
      if (e.cancelable) e.preventDefault();
      if (eggTimer) window.clearTimeout(eggTimer);
      eggTimer = window.setTimeout(function () {
        eggTimer = null;
        openEgg();
      }, 1500);
    });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (evt) {
      eggStar.addEventListener(evt, function () {
        if (eggTimer) { window.clearTimeout(eggTimer); eggTimer = null; }
      });
    });
  }

  /* ============================ 开场与启动 ============================ */
  function startFlow() {
    tone(560, 0.06);
    if (hasProgress() && state.chapter >= 6) {
      openFinal();
      return;
    }
    if (hasProgress()) {
      mountChapter(state.chapter);
    } else {
      mountChapter(1);
    }
  }

  function resetAll() {
    tone(480, 0.06);
    try { localStorage.removeItem(STORE_KEY); } catch (err) { /* 本地存档不可用时静默跳过 */ }
    if (typingTimer) { window.clearInterval(typingTimer); typingTimer = null; }
    typed = false;
    fullLetterText = '';
    state.chapter = 1;
    state.solved = [];
    state.jigsaw = null;
    state.jigsawChapter = 0;
    jig = null;
    hintLevel = 0;
    if (puzzleHost) puzzleHost.innerHTML = '';
    if (hintText) hintText.textContent = '';
    if (msgEl) msgEl.textContent = '';
    showScreen('screen-intro');
    applyStaticText();
  }

  function applyStaticText() {
    document.title = CONFIG.title;

  function onActionClick(e) {
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var action = el.getAttribute('data-action');

    if (action === 'start') { startFlow(); return; }
    if (action === 'next') { tone(560, 0.06); goNext(); return; }
    if (action === 'restart') { resetAll(); return; }
    if (action === 'archive') { openArchive(); return; }
    if (action === 'close-archive') { showScreen('screen-stage'); return; }
    if (action === 'hint') { showHint(); return; }
    if (action === 'mute') { toggleMute(); return; }
    if (action === 'close-egg') { showScreen('screen-final'); return; }
    if (action === 'type') {
      if (!typed) finishTyping();
      else startTyping();
      return;
    }
  }

  /* ============================ 星空背景 ============================ */
  function startStars() {
    var canvas = $('#stars');
    if (!canvas) return;
    var g = canvas.getContext('2d');
    if (!g) return;

    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var stars = [];
    var width = 0;
    var height = 0;
    var lastTick = 0;
    var rafId = null;

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      g.setTransform(dpr, 0, 0, dpr, 0, 0);

      var count = Math.round((width * height) / 20000);
      count = clamp(count, 40, 110);
      stars = [];
      for (var i = 0; i < count; i++) {
        stars.push({
          x: Math.random() * width,
          y: Math.random() * height,
          r: Math.random() * 1.3 + 0.3,
          a: Math.random() * 0.55 + 0.12,
          s: reduce ? 0 : Math.random() * 0.16 + 0.03,
          p: Math.random() * Math.PI * 2
        });
      }
    }

    function loop(t) {
      rafId = window.requestAnimationFrame(loop);
      if (t - lastTick < 50) return;
      lastTick = t;

      g.clearRect(0, 0, width, height);
      for (var i = 0; i < stars.length; i++) {
        var st = stars[i];
        st.y -= st.s;
        if (st.y < -4) {
          st.y = height + 4;
          st.x = Math.random() * width;
        }
        var twinkle = reduce ? st.a : st.a * (0.75 + 0.25 * Math.sin(t / 900 + st.p));
        g.globalAlpha = twinkle;
        g.fillStyle = '#ffffff';
        g.beginPath();
        g.arc(st.x, st.y, st.r, 0, Math.PI * 2);
        g.fill();
      }
      g.globalAlpha = 1;
    }

    resize();
    window.addEventListener('resize', resize);
    rafId = window.requestAnimationFrame(loop);
  }

  /* ============================ 粒子动效 ============================ */
  var fxApi = null;
  var FX_FONT = '-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';

  function startFx() {
    var canvas = $('#fx');
    if (!canvas) return;
    var g = canvas.getContext('2d');
    if (!g) return;
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    var off = document.createElement('canvas');
    var octx = off.getContext('2d', { willReadFrequently: true });
    if (!octx) return;

    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var W = 0;
    var H = 0;
    var mode = 'none';
    var stage = 'assemble';
    var stageAt = 0;
    var now = 0;
    var last = 0;
    var rafId = 0;
    var dust = [];
    var sparks = [];
    var hearts = [];
    var flow = [];
    var twinkles = [];
    var nextTwinkle = 0;
    var nextHeart = 0;
    var nextBurst = 0;
    var titleEl = $('#introTitle');
    var intro = { cx: 0, cy: 0, w: 0, ratio: 0.7 };
    var egg = { cx: 0, cy: 0, kv: 1, atArc: null, perimeter: 1, kcv: null, kctx: null, kx: 0, ky: 0, kw: 0, kh: 0, edgeR: null, cenY: 0 };
    var eggHalo = null;
    var eggCv = null;
    var fin = { l: 0, r: 0, b: 0 };
    var fwBands = [];
    var CYCLE = { assemble: 1500, hold: 2400, settle: 900, rest: 3000 };

    function easeOut(k) { return 1 - Math.pow(1 - k, 3); }

    function sized() {
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = Math.floor(W * dpr);
      canvas.height = Math.floor(H * dpr);
      canvas.style.width = W + 'px';
      canvas.style.height = H + 'px';
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    /* 彩蛋层画布：插在信纸内部，位于信纸底色之上、文字之下 */
    function ensureEggCanvas() {
      var paperEl = $('#screen-egg .paper');
      if (!paperEl) return null;
      if (!eggCv) {
        eggCv = document.createElement('canvas');
        eggCv.id = 'eggFx';
        eggCv.setAttribute('aria-hidden', 'true');
        if (paperEl.firstChild) paperEl.insertBefore(eggCv, paperEl.firstChild);
        else paperEl.appendChild(eggCv);
      }
      var cg = eggCv.getContext('2d');
      if (!cg) return null;
      eggCv.width = Math.floor(W * dpr);
      eggCv.height = Math.floor(H * dpr);
      eggCv.style.width = W + 'px';
      eggCv.style.height = H + 'px';
      cg.setTransform(dpr, 0, 0, dpr, 0, 0);
      return cg;
    }

    /* 文字取样：3 倍超采样后按 alpha 阈值取点 */
    function sampleText(txt, size, tracking, gap) {
      var SS = 3;
      var fs = size * SS;
      var chars = String(txt).split('');
      var ws = [];
      var total = 0;
      var i;
      octx.font = '600 ' + fs + 'px ' + FX_FONT;
      for (i = 0; i < chars.length; i++) {
        ws.push(octx.measureText(chars[i]).width);
        total += ws[i] + (i < chars.length - 1 ? tracking * SS : 0);
      }
      var pad = Math.ceil(fs * 0.3);
      var ow = Math.ceil(total) + pad * 2;
      var oh = Math.ceil(fs * 1.46) + pad * 2;
      off.width = ow;
      off.height = oh;
      octx.clearRect(0, 0, ow, oh);
      octx.font = '600 ' + fs + 'px ' + FX_FONT;
      octx.textAlign = 'left';
      octx.textBaseline = 'middle';
      octx.fillStyle = '#ffffff';
      var x = pad;
      var y = oh / 2;
      for (i = 0; i < chars.length; i++) {
        octx.fillText(chars[i], x, y);
        x += ws[i] + tracking * SS;
      }
      var data = octx.getImageData(0, 0, ow, oh).data;
      var step = Math.max(2, Math.round(gap * SS));
      var pts = [];
      for (var py = 0; py < oh; py += step) {
        for (var px = 0; px < ow; px += step) {
          if (data[(py * ow + px) * 4 + 3] > 132) {
            pts.push({
              x: (px + (Math.random() - 0.5) * step) / SS,
              y: (py + (Math.random() - 0.5) * step) / SS
            });
          }
        }
      }
      return { pts: pts, w: ow / SS, h: oh / SS };
    }

    function makeDust(bx, by, goldChance) {
      return {
        x: Math.random() * W,
        y: Math.random() * H,
        vx: 0,
        vy: 0,
        bx: bx,
        by: by,
        tx: bx,
        ty: by,
        r: 1.7 + Math.random() * 1.2,
        gold: Math.random() < goldChance,
        a: 0,
        tw: Math.random() * Math.PI * 2
      };
    }

    /* ---------- 开场：标题聚字 ---------- */
    function buildIntro() {
      dust = [];
      if (!titleEl) { mode = 'none'; return; }
      var rect = titleEl.getBoundingClientRect();
      var fs = parseFloat(window.getComputedStyle(titleEl).fontSize) || 28;
      var big = clamp(fs * 1.45, 34, 48);
      var cy = rect.top + rect.height / 2;

      var res = sampleText(CONFIG.title, big, big * 0.1, 1.7);
      if (res.pts.length < 700) {
        var dense = sampleText(CONFIG.title, big, big * 0.1, 1.25);
        if (dense.pts.length > res.pts.length) res = dense;
      }

      intro.cx = W / 2;
      intro.cy = cy;
      intro.w = res.w;
      intro.ratio = fs / big;

      var left = intro.cx - res.w / 2;
      var top = cy - res.h / 2;
      var pts = res.pts;
      if (pts.length > 1600) {
        var keep = [];
        var stride = pts.length / 1600;
        for (var s = 0; s < pts.length; s += stride) keep.push(pts[Math.floor(s)]);
        pts = keep;
      }
      for (var i = 0; i < pts.length; i++) {
        dust.push(makeDust(left + pts[i].x, top + pts[i].y, 0.2));
      }

      titleEl.style.transition = 'opacity .7s ease';
      titleEl.style.opacity = '0';
      stage = 'assemble';
      stageAt = now || performance.now();
      mode = 'intro';
    }

    /* 粒子光晕精灵：预渲染径向渐变，绘制时用 lighter 叠加出辉光质感 */
    var glowSprites = [];
    function buildSprites() {
      if (glowSprites.length) return;
      var defs = [
        ['rgba(255,250,238,0.95)', 'rgba(238,206,140,0.60)', 'rgba(196,156,54,0.15)'],
        ['rgba(255,240,240,0.92)', 'rgba(212,142,150,0.58)', 'rgba(160,88,98,0.14)'],
        ['rgba(255,255,255,0.98)', 'rgba(248,236,214,0.52)', 'rgba(220,196,154,0.13)']
      ];
      var R = 36;
      for (var i = 0; i < defs.length; i++) {
        var cv = document.createElement('canvas');
        cv.width = R * 2;
        cv.height = R * 2;
        var c2 = cv.getContext('2d');
        if (!c2) return;
        var rg = c2.createRadialGradient(R, R, 0, R, R, R);
        rg.addColorStop(0, defs[i][0]);
        rg.addColorStop(0.2, defs[i][1]);
        rg.addColorStop(0.48, defs[i][2]);
        rg.addColorStop(1, 'rgba(0,0,0,0)');
        c2.fillStyle = rg;
        c2.beginPath();
        c2.arc(R, R, R, 0, Math.PI * 2);
        c2.fill();
        glowSprites.push(cv);
      }
    }

    /* ---------- 彩蛋：粒子心形（点云画法：轮廓 + 边缘扩散 + 内部填充 + 外圈光晕） ---------- */
    var EGG_PAL = ['#d99a3f', '#e2a86b', '#dfa08a', '#d98f8e', '#c97a86', '#f3e0bd'];
    function buildEgg() {
      dust = [];
      flow = [];
      twinkles = [];
      eggHalo = null;
      buildSprites();
      var paper = $('#screen-egg .paper');
      var pr = paper ? paper.getBoundingClientRect() : null;
      var hasPaper = !!(pr && pr.width > 60);
      var cx = hasPaper ? (pr.left + pr.right) / 2 : W / 2;
      var cyP = hasPaper ? (pr.top + pr.bottom) / 2 : H / 2;
      /* 与信纸同水平线：按信纸宽度放大，位于信纸底色之上、文字之下 */
      var targetW = hasPaper ? Math.max(pr.width * 1.14, W * 0.8) : W * 0.8;
      var s = Math.min(targetW / 32, (W - 20) / 32);
      s = Math.min(s, Math.max(3.2, (Math.min(cyP, H - cyP) - 8) / 11));

      /* 笛卡尔心形曲线：x = 16sin³t；y = 13cos t − 5cos2t − 2cos3t − cos4t */
      function hxAt(t) { return 16 * Math.pow(Math.sin(t), 3) * s; }
      function hyAt(t) { return -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * s; }

      egg.cx = cx;
      egg.cy = cyP - 6 * s;

      /* 轮廓点：随机取 t，点布满整个心形边缘 */
      var base = [];
      for (var i = 0; i < 1100; i++) {
        var t = Math.random() * Math.PI * 2;
        base.push([hxAt(t), hyAt(t)]);
      }
      /* 对数散射：向心方向随机偏移，越靠中心越容易命中 */
      function scatter(p, beta) {
        var rx = -beta * Math.log(Math.random() || 1e-6);
        var ry = -beta * Math.log(Math.random() || 1e-6);
        return [p[0] * (1 - rx), p[1] * (1 - ry)];
      }
      var pts = [];
      function push(x, y, sz, ai, layer) {
        var rr = Math.sqrt(x * x + y * y) || 0.001;
        (layer ? ptsInner : ptsOuter)[ai].push({ x: x, y: y, f: 1 / (Math.pow(rr, 0.55) + 12), sz: sz });
      }
      var ptsOuter = [[], [], [], [], [], []];
      var ptsInner = [[], [], [], [], [], []];
      for (var i1 = 0; i1 < base.length; i1++) {
        var b1 = base[i1];
        push(b1[0], b1[1], Math.random() < 0.5 ? 2 : 1.4, Math.random() < 0.5 ? 0 : (Math.random() < 0.5 ? 1 : 2), 0);
        for (var k1 = 0; k1 < 2; k1++) {
          var e1 = scatter(b1, 0.045);
          push(e1[0], e1[1], 1.3, Math.random() < 0.6 ? 3 : 4, 0);
        }
        var h1 = scatter(b1, 0.18);
        push(h1[0], h1[1], 1.1, 3 + Math.floor(Math.random() * 3), 0);
      }
      /* 内部填充：让心形实心饱满，用细密的浅色点压出体积 */
      for (var i2 = 0; i2 < 6200; i2++) {
        var c1 = scatter(base[Math.floor(Math.random() * base.length)], 0.26);
        push(c1[0], c1[1], 1 + Math.random() * 0.4, Math.random() < 0.5 ? 3 : (Math.random() < 0.6 ? 4 : (Math.random() < 0.5 ? 2 : 1)), 1);
      }
      /* 外圈光晕：放大一圈并散开，形成毛茸茸的边 */
      for (var i3 = 0; i3 < 1100; i3++) {
        var t3 = Math.random() * Math.PI * 2;
        var hx = hxAt(t3) * 1.045 + (Math.random() - 0.5) * 16;
        var hy = hyAt(t3) * 1.045 + (Math.random() - 0.5) * 16;
        push(hx, hy, 1, Math.random() < 0.5 ? 0 : 2, 0);
      }
      egg.pts = ptsOuter;
      egg.ptsIn = ptsInner;
      egg.pulse = 0;
      egg.op = 1;

      /* 心形柔光底：径向渐变 + 模糊，一次预渲染，逐帧只叠加一次 */
      var padY = 40;
      var boxW = Math.ceil(32 * s + 80);
      var boxH = Math.ceil(22 * s + padY * 2);
      var hcv = document.createElement('canvas');
      hcv.width = boxW;
      hcv.height = boxH;
      var hg = hcv.getContext('2d');
      if (hg) {
        hg.translate(boxW / 2, padY + 5 * s);
        hg.beginPath();
        for (var q2 = 0; q2 <= 180; q2++) {
          var a2 = q2 / 180 * Math.PI * 2;
          if (q2) hg.lineTo(hxAt(a2), hyAt(a2));
          else hg.moveTo(hxAt(a2), hyAt(a2));
        }
        hg.closePath();
        var rgc = hg.createRadialGradient(0, 2 * s, 0, 0, 2 * s, 17 * s);
        rgc.addColorStop(0, 'rgba(240,196,146,0.40)');
        rgc.addColorStop(0.65, 'rgba(226,158,124,0.16)');
        rgc.addColorStop(1, 'rgba(226,158,124,0)');
        hg.fillStyle = rgc;
        hg.fill();
        /* Safari 不支持 canvas filter，仅在有该能力时叠加第二层模糊 */
        if (typeof hg.filter === 'string') {
          hg.filter = 'blur(' + Math.max(6, Math.round(s * 1.2)) + 'px)';
          hg.fillStyle = 'rgba(228,150,120,0.5)';
          hg.fill();
          hg.filter = 'none';
        }
        eggHalo = { cv: hcv, x: cx - boxW / 2, y: egg.cy - (padY + 5 * s) };
      }

      egg.kv = 1;
      egg.ctx = ensureEggCanvas();
      stage = 'hold';
      stageAt = now || performance.now();
      mode = 'egg';
    }

    /* ---------- 终章：落款处的爱心 ---------- */
    function buildFinal() {
      hearts = [];
      buildSprites();
      var paper = $('#screen-final .paper');
      var pr = paper ? paper.getBoundingClientRect() : null;
      if (pr && pr.width > 60) {
        fin.l = pr.left;
        fin.r = pr.right;
        fin.b = pr.bottom;
      } else {
        fin.l = W * 0.15;
        fin.r = W * 0.85;
        fin.b = H * 0.72;
      }
      nextHeart = now;
      mode = 'final';
    }

    /* ---------- 第三关：烟花 ---------- */
    function burst() {
      var pals = [
        ['#f6e6bb', '#c9a227'],
        ['#f6efdd', '#c2787e'],
        ['#e6cd8f', '#9db0d6']
      ];
      var pal = pals[Math.floor(Math.random() * pals.length)];
      var band = fwBands[Math.floor(Math.random() * fwBands.length)] || { y0: H * 0.1, y1: H * 0.3 };
      var span = Math.max(0, band.y1 - band.y0);
      var pad = Math.min(70, span / 2);
      var ox = 70 + Math.random() * Math.max(1, W - 140);
      var oy = band.y0 + pad + Math.random() * Math.max(0, span - pad * 2);
      for (var i = 0; i < 90; i++) {
        var ang = Math.random() * Math.PI * 2;
        var sp = 1.2 + Math.random() * 4.4;
        sparks.push({
          x: ox,
          y: oy,
          vx: Math.cos(ang) * sp,
          vy: Math.sin(ang) * sp,
          life: 1,
          span: 720 + Math.random() * 320,
          color: i % 2 ? pal[0] : pal[1],
          r: 0.9 + Math.random() * 1.1
        });
      }
    }

    function spring(p) {
      p.vx += (p.tx - p.x) * 0.055;
      p.vy += (p.ty - p.y) * 0.055;
      p.vx *= 0.87;
      p.vy *= 0.87;
      p.x += p.vx;
      p.y += p.vy;
    }

    function updateIntro(dt) {
      var el = now - stageAt;
      if (stage === 'assemble' && el > CYCLE.assemble) {
        stage = 'hold';
        stageAt = now;
      } else if (stage === 'hold' && el > CYCLE.hold) {
        stage = 'settle';
        stageAt = now;
        if (titleEl) titleEl.style.opacity = '1';
      } else if (stage === 'settle' && el > CYCLE.settle) {
        stage = 'rest';
        stageAt = now;
      } else if (stage === 'rest' && el > CYCLE.rest) {
        for (var k = 0; k < dust.length; k++) {
          var q = dust[k];
          q.x = Math.random() * W;
          q.y = Math.random() * H;
          q.vx = 0;
          q.vy = 0;
          q.a = 0;
          q.tx = q.bx;
          q.ty = q.by;
        }
        if (titleEl) titleEl.style.opacity = '0';
        stage = 'assemble';
        stageAt = now;
      }

      el = now - stageAt;
      var kk = 1;
      if (stage === 'settle') {
        kk = 1 - (1 - intro.ratio) * easeOut(Math.min(1, el / (CYCLE.settle * 0.9)));
      }

      for (var i = 0; i < dust.length; i++) {
        var p = dust[i];
        p.tx = intro.cx + (p.bx - intro.cx) * kk;
        p.ty = intro.cy + (p.by - intro.cy) * kk;
        if (stage === 'rest') p.a = Math.max(0, p.a - dt / 260);
        else if (stage === 'settle') p.a = Math.max(0, 0.95 * (1 - el / CYCLE.settle));
        else p.a = Math.min(0.95, p.a + dt / 480);
        spring(p);
      }
    }

    function spawnTwinkle() {
      if (!egg.edgeR || !egg.edgeR.length || !egg.kctx) return;
      var dirs = egg.edgeR.length;
      var di = Math.floor(Math.random() * dirs);
      var rr = Math.pow(Math.random(), 0.85) * 0.9;
      var ang = (di + Math.random()) / dirs * Math.PI * 2;
      var lx = Math.cos(ang) * egg.edgeR[di] * rr;
      var ly = egg.cenY + Math.sin(ang) * egg.edgeR[di] * rr;
      twinkles.push({
        x: egg.cx - egg.kx + lx,
        y: egg.cy - egg.ky + ly,
        life: 0,
        span: 240 + Math.random() * 280, size: 2.2 + Math.random() * 3.4,
        rot: Math.random() * Math.PI,
        gold: Math.random() < 0.55
      });
    }

    function updateEgg(dt) {
      var el = now - stageAt;
      var grow = 0.9 + 0.1 * easeOut(Math.min(1, el / 900));
      var ph = el / 1500 * Math.PI * 2;
      /* 心跳：越靠外的点位移越大，形成由内向外的呼吸式脉动 */
      egg.pulse = 1.55 * Math.sin(ph - Math.PI / 2) - 0.25;
      egg.kv = grow;
      /* 展示完成后停留 2 秒，再用 0.7 秒淡出消失 */
      egg.op = el < 2900 ? 1 : clamp(1 - (el - 2900) / 700, 0, 1);
    }

    function updateFireworks(dt) {
      if (now >= nextBurst) {
        burst();
        nextBurst = now + 1300;
      }
      var f = dt / 16;
      for (var i = sparks.length - 1; i >= 0; i--) {
        var p = sparks[i];
        p.vx *= Math.pow(0.985, f);
        p.vy = p.vy * Math.pow(0.985, f) + 0.06 * f;
        p.x += p.vx * f;
        p.y += p.vy * f;
        p.life -= dt / p.span;
        if (p.life <= 0) sparks.splice(i, 1);
      }
    }

    function updateFinal(dt) {
      var f = dt / 16;
      if (now >= nextHeart) {
        nextHeart = now + 170 + Math.random() * 140;
        hearts.push({
          x: fin.l + 12 + Math.random() * Math.max(20, fin.r - fin.l - 24),
          y: fin.b - 6 - Math.random() * 8,
          vx: (Math.random() - 0.5) * 0.2,
          vy: -(0.34 + Math.random() * 0.3),
          s: 4.5 + Math.random() * 4,
          rot: (Math.random() - 0.5) * 0.6,
          ph: Math.random() * Math.PI * 2,
          life: 0,
          span: 2100 + Math.random() * 1300,
          gold: Math.random() < 0.4
        });
      }
      for (var i = hearts.length - 1; i >= 0; i--) {
        var p = hearts[i];
        p.life += dt;
        p.vy += 0.012 * f;
        p.x += (p.vx + Math.sin(p.life / 720 + p.ph) * 0.16) * f;
        p.y += p.vy * f;
        if (p.life >= p.span) hearts.splice(i, 1);
      }
    }

    /* ---------- 绘制 ---------- */
    function drawDust(t) {
      for (var i = 0; i < dust.length; i++) {
        var p = dust[i];
        if (p.a <= 0.02) continue;
        var tw = 0.78 + 0.22 * Math.sin(t / 620 + p.tw);
        g.globalAlpha = clamp(p.a * tw, 0, 1);
        g.fillStyle = p.color || (p.gold ? '#e6cd8f' : '#f6efdd');
        g.beginPath();
        g.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        g.fill();
      }
      g.globalAlpha = 1;
    }

    function drawGlow(x, y, r, a) {
      if (a <= 0.003 || r <= 0) return;
      g.save();
      g.translate(x, y);
      g.scale(1, 0.44);
      var rg = g.createRadialGradient(0, 0, 0, 0, 0, r);
      rg.addColorStop(0, 'rgba(230,205,143,' + a.toFixed(3) + ')');
      rg.addColorStop(0.55, 'rgba(201,162,39,' + (a * 0.45).toFixed(3) + ')');
      rg.addColorStop(1, 'rgba(201,162,39,0)');
      g.fillStyle = rg;
      g.beginPath();
      g.arc(0, 0, r, 0, Math.PI * 2);
      g.fill();
      g.restore();
    }

    function heartPath(x, y, s, rot) {
      g.save();
      g.translate(x, y);
      if (rot) g.rotate(rot);
      g.beginPath();
      g.moveTo(0, s);
      g.bezierCurveTo(-s * 1.4, s * 0.1, -s * 0.95, -s * 0.9, 0, -s * 0.35);
      g.bezierCurveTo(s * 0.95, -s * 0.9, s * 1.4, s * 0.1, 0, s);
      g.fill();
      g.restore();
    }

    function render() {
      g.clearRect(0, 0, W, H);

      if (mode === 'intro') {
        var el = now - stageAt;
        var ga = 0;
        if (stage === 'assemble') ga = 0.05 * Math.min(1, el / 900);
        else if (stage === 'hold') ga = 0.06 + 0.03 * Math.sin(el / 520);
        else if (stage === 'settle') ga = 0.06 * Math.max(0, 1 - el / CYCLE.settle);
        drawGlow(intro.cx, intro.cy, Math.max(120, intro.w * 0.62), ga);
        drawDust(now);
        return;
      }

      if (mode === 'egg') {
        var gBase = g;
        if (egg.ctx) { g = egg.ctx; g.clearRect(0, 0, W, H); }
        var op = egg.op == null ? 1 : egg.op;
        if (op <= 0.005) { g = gBase; return; }
        drawGlow(egg.cx, egg.cy, Math.min(W, H) * 0.42, 0.03 * op);
        if (eggHalo) {
          g.save();
          g.globalCompositeOperation = 'lighter';
          g.globalAlpha = 0.5 * op;
          g.drawImage(eggHalo.cv, eggHalo.x, eggHalo.y);
          g.restore();
        }
        if (egg.pts) {
          var kk = egg.kv;
          var pl = egg.pulse;
          var lay = [egg.pts, egg.ptsIn];
          var alphas = [0.92, 0.56];
          for (var ly = 0; ly < 2; ly++) {
            g.globalAlpha = alphas[ly] * op;
            for (var ci = 0; ci < lay[ly].length; ci++) {
              var arr = lay[ly][ci];
              if (!arr.length) continue;
              g.fillStyle = EGG_PAL[ci];
              for (var j = 0; j < arr.length; j++) {
                var p = arr[j];
                var sc = 1 - pl * p.f;
                g.fillRect(egg.cx + p.x * sc * kk, egg.cy + p.y * sc * kk, p.sz, p.sz);
              }
            }
          }
          g.globalAlpha = 1;
        }
        g = gBase;
        return;
      }

      if (mode === 'final') {
        drawGlow((fin.l + fin.r) / 2, fin.b - 12, Math.max(90, (fin.r - fin.l) * 0.5),
          0.055 + 0.025 * Math.sin(now / 900));
        for (var i = 0; i < hearts.length; i++) {
          var p = hearts[i];
          var k = p.life / p.span;
          if (k <= 0 || k >= 1) continue;
          var ga2 = Math.sin(Math.PI * k);
          if (glowSprites.length) {
            g.globalAlpha = ga2 * 0.22;
            var gd = p.s * 5.4;
            g.drawImage(glowSprites[p.gold ? 0 : 1], p.x - gd / 2, p.y - gd / 2, gd, gd);
          }
          g.globalAlpha = ga2 * 0.76;
          g.fillStyle = p.gold ? '#d9b262' : '#c98b8b';
          heartPath(p.x, p.y, p.s, p.rot);
        }
        g.globalAlpha = 1;
        return;
      }

      if (mode === 'fireworks') {
        g.lineCap = 'round';
        for (var j = 0; j < sparks.length; j++) {
          var s = sparks[j];
          if (s.life <= 0) continue;
          g.globalAlpha = clamp(s.life, 0, 1) * 0.95;
          g.strokeStyle = s.color;
          g.lineWidth = s.r;
          g.beginPath();
          g.moveTo(s.x - s.vx * 2.4, s.y - s.vy * 2.4);
          g.lineTo(s.x, s.y);
          g.stroke();
        }
        g.globalAlpha = 1;
      }
    }

    function frame(t) {
      rafId = 0;
      now = t || performance.now();
      var dt = last ? Math.min(now - last, 48) : 16;
      last = now;

      if (mode === 'intro') updateIntro(dt);
      else if (mode === 'egg') updateEgg(dt);
      else if (mode === 'fireworks') updateFireworks(dt);
      else if (mode === 'final') updateFinal(dt);

      render();
      if (mode !== 'none') rafId = window.requestAnimationFrame(frame);
    }

    function stopAll() {
      mode = 'none';
      dust = [];
      sparks = [];
      hearts = [];
      flow = [];
      twinkles = [];
      eggHalo = null;
      egg.ctx = null;
      if (eggCv) {
        var _eg = eggCv.getContext('2d');
        if (_eg) _eg.clearRect(0, 0, eggCv.width, eggCv.height);
      }
      last = 0;
      g.clearRect(0, 0, W, H);
      if (titleEl) {
        titleEl.style.transition = '';
        titleEl.style.opacity = '';
      }
    }

    function enter(id) {
      stopAll();
      if (id === 'screen-intro') buildIntro();
      else if (id === 'screen-egg') buildEgg();
      else if (id === 'screen-final') buildFinal();
      else if (id === 'screen-unlock' && state.chapter === 3) {
        var paper = $('#screen-unlock .paper');
        var pr = paper ? paper.getBoundingClientRect() : null;
        fwBands = [];
        if (pr && pr.top > 130) fwBands.push({ y0: 20, y1: pr.top - 26 });
        if (pr && H - pr.bottom > 130) fwBands.push({ y0: pr.bottom + 28, y1: H - 20 });
        if (!fwBands.length) fwBands.push({ y0: H * 0.08, y1: H * 0.36 });
        sparks = [];
        nextBurst = now;
        mode = 'fireworks';
      }
      canvas.style.zIndex = (mode === 'fireworks' || mode === 'egg') ? '5' : '30';
      if (mode === 'none') return;
      if (!rafId) rafId = window.requestAnimationFrame(frame);
    }

    function bloom() {
      if (mode !== 'final') return;
      var cx = (fin.l + fin.r) / 2;
      for (var i = 0; i < 30; i++) {
        var ang = -Math.PI / 2 + (Math.random() - 0.5) * 1.7;
        var sp = 0.9 + Math.random() * 2.4;
        hearts.push({
          x: cx + (Math.random() - 0.5) * 56,
          y: fin.b - 6,
          vx: Math.cos(ang) * sp,
          vy: Math.sin(ang) * sp,
          s: 4 + Math.random() * 5,
          rot: (Math.random() - 0.5) * 0.8,
          ph: Math.random() * Math.PI * 2,
          life: 0,
          span: 1500 + Math.random() * 900,
          gold: Math.random() < 0.45
        });
      }
    }

    function onResize() {
      sized();
      if (mode === 'intro') buildIntro();
      else if (mode === 'egg') buildEgg();
      else if (mode === 'final') buildFinal();
    }

    sized();
    window.addEventListener('resize', onResize);
    fxApi = { enter: enter, bloom: bloom };
  }

  /* ============================ 兜底 ============================ */
  function renderFatal() {
    try {
      var fallback = document.createElement('div');
      fallback.style.cssText = 'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b1026;color:#efe9dc;font-size:16px;line-height:1.9;padding:32px;text-align:center;z-index:9999;';
      fallback.textContent = '哎呀，出错了，请重新打开这封信。';
      document.body.innerHTML = '';
      document.body.appendChild(fallback);
    } catch (err) { /* 极端情况下不再二次抛出 */ }
  }

  /* ============================ 初始化 ============================ */
  function initApp() {
    msgEl = $('#msg');
    chapterLabel = $('#chapterLabel');
    chapterIntro = $('#chapterIntro');
    hintText = $('#hintText');
    unlockTitle = $('#unlockTitle');
    unlockLetter = $('#unlockLetter');
    archiveList = $('#archiveList');
    finalLetter = $('#finalLetter');
    typeBtn = $('#typeBtn');
    eggStar = $('#eggStar');
    eggTip = $('#eggTip');
    eggText = $('#eggText');
    puzzleHost = $('#puzzleHost');
    keysEl = $('#keys');
    muteBtn = $('#muteBtn');

    loadState();
    applyStaticText();
    bindEgg();
    startStars();
    startFx();

    document.addEventListener('click', onActionClick);
    window.addEventListener('pointerup', onPointerUpGlobal);
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && $('#screen-archive').classList.contains('active')) {
        showScreen('screen-stage');
      }
    });

    showScreen('screen-intro');
  }

  window.addEventListener('load', function () {
    try {
      initApp();
    } catch (err) {
      renderFatal();
    }
  });
})();
</script>
